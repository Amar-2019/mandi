<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-brd: rgba(117, 87, 87, 0.25);
      --text: #0f172a;
      --muted: #0f172a;
      --accent2: #a78bfa;
      --accent3: #f472b6;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }

    body {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: var(--text);
    }

    .squares {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      top: 0;
      left: 0;
      z-index: -1;
    }
    .squares li {
      position: absolute;
      display: block;
      list-style: none;
      width: 25px;
      height: 25px;
      background: rgba(255, 255, 255, 0.1);
      animation: animate 20s linear infinite;
      bottom: -150px;
    }
    .squares li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-duration: 25s; }
    .squares li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 2s; }
    .squares li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
    .squares li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 18s; animation-delay: 0s; }
    .squares li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 3s; }
    .squares li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 7s; }
    .squares li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 15s; animation-duration: 45s; }
    .squares li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 35s; }
    .squares li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
    .squares li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

    @keyframes animate {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-brd);
      border-radius: 28px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15) inset;
    }

    h1 { font-size: 1.4rem; margin: 0; letter-spacing: 0.2px; }
    p.sub { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }

    form { margin-top: 20px; }
    .field { position: relative; margin: 18px 0; }
    .input {
      width: 100%; padding: 16px;
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.7);
      outline: none; font-size: 1rem;
    }

    .btn {
      width: 100%; border: 0; cursor: pointer;
      padding: 14px 18px; border-radius: 18px;
      font-weight: 600; font-size: 1rem;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      color: white;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    .btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <!-- ===== Animated Squares Background ===== -->
  <ul class="squares">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

  <div class="card">
    <h1>Welcome Back</h1>
    <p class="sub">Sign in with your ID & password</p>
    <form action="" method="post">
      {% csrf_token %}
      <div class="field">
        <input id="userId" name="userId" class="input" type="text" placeholder="ID" required />
      </div>
      <div class="field">
        <input id="password" name="password" class="input" type="password" placeholder="Password" required />
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
