    background: #f1f3f9;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    margin-top: 5px;
    width: 320px;
    position: absolute;
    z-index: 5000;
    top: 100%;
    left: 0;
  }

  .panel-wrapper {
    position: relative;
    display: inline-block;
  }

  .dropdown-panel select {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    max-height: 120px;
    overflow-y: auto;
    margin-top: 5px;
  }

  .corridor-wrapper {
    position: relative;
    display: inline-block;
  }

  .route-type-wrapper {
    position: relative;
    display: inline-block;
  }

    display: none;
    position: absolute;
    left: 0;

    border-radius: 6px;

<!-- ====================== MAIN SCRIPT ====================== -->
<script>
  // =================== GLOBAL VARIABLES =====================
  let map;
  let selectedPoints = [];
  let routeLayer = null;
  let currentCorridorType = null;
  let currentRouteType = null;
  let poiLayer;
  let activePoILabel = null;
  let activePoILabelTimer = null;

  const icons = {
    village: L.divIcon({
      className: "custom-marker",
      html: '<img src="/static/images/village_icon.png" width="32" height="32">',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
    }),
    mandi: L.divIcon({
      className: "custom-marker",
      html: '<img src="/static/images/mandi_icon.png" width="32" height="32">',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
    }),
    destination: L.divIcon({
      className: "custom-marker",
      html: '<img src="/static/images/point_icon.png" width="32" height="32">',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
    }),
  };

  // =================== HELPER FUNCTIONS FOR POI MARKERS =====================

  // Helper function to build coordinates from route layer
  function buildCoordsFromRouteLayer(layer) {
    try {
      const geo = layer.toGeoJSON();
      const coords = [];
      if (!geo || !geo.features) return coords;
      geo.features.forEach((f) => {
        const g = f.geometry;
        if (!g) return;
        if (g.type === "LineString") {
          g.coordinates.forEach((c) => coords.push(c)); // [lng, lat]
        } else if (g.type === "MultiLineString") {
          g.coordinates.forEach((line) => line.forEach((c) => coords.push(c)));
        }
      });
      // remove consecutive duplicates
      const cleaned = [];
      for (let i = 0; i < coords.length; i++) {
        const c = coords[i];
        const prev = cleaned[cleaned.length - 1];
        if (!prev || prev[0] !== c[0] || prev[1] !== c[1]) cleaned.push(c);
      }
      return cleaned;
    } catch (e) {
      return [];
    }
  }

  // Geometry helper functions
  const R_EARTH = 6371000;
  function deg2rad(d) {
    return (d * Math.PI) / 180;
  }
  function haversineMeters(aLat, aLng, bLat, bLng) {
    const φ1 = deg2rad(aLat),
      φ2 = deg2rad(bLat);
    const dφ = deg2rad(bLat - aLat),
      dλ = deg2rad(bLng - aLng);
    const sinDφ = Math.sin(dφ / 2),
      sinDλ = Math.sin(dλ / 2);
    const aa = sinDφ * sinDφ + Math.cos(φ1) * Math.cos(φ2) * sinDλ * sinDλ;
    const c = 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1 - aa));
    return R_EARTH * c;
  }
  function pointToSegmentDistMeters(ptLat, ptLng, aLat, aLng, bLat, bLng) {
    if (aLat === bLat && aLng === bLng)
      return haversineMeters(ptLat, ptLng, aLat, aLng);

    const meanLat = deg2rad((aLat + bLat + ptLat) / 3);
    const dxAB = deg2rad(bLng - aLng) * Math.cos(meanLat) * R_EARTH;
    const dyAB = deg2rad(bLat - aLat) * R_EARTH;
    const dxAP = deg2rad(ptLng - aLng) * Math.cos(meanLat) * R_EARTH;
    const dyAP = deg2rad(ptLat - aLat) * R_EARTH;

    const ab2 = dxAB * dxAB + dyAB * dyAB;
    let t = (dxAP * dxAB + dyAP * dyAB) / ab2;
    if (t < 0) t = 0;
    if (t > 1) t = 1;

    const closestX = dxAB * t;
    const closestY = dyAB * t;
    const dX = dxAP - closestX;
    const dY = dyAP - closestY;
    return Math.sqrt(dX * dX + dY * dY);
  }

  // Collect POIs from select lists
  function collectPOIsFromSelects() {
    const villages = [];
    const mandis = [];

    const vSelect = document.getElementById("village");
    if (vSelect) {
      for (let opt of vSelect.options) {
        if (!opt.value) continue;
        const lat = parseFloat(opt.dataset.lat);
        const lng = parseFloat(opt.dataset.lng);
        if (!isNaN(lat) && !isNaN(lng))
          villages.push({ id: opt.value, name: opt.text, lat, lng });
      }
    }

    const mSelect = document.getElementById("mandi");
    if (mSelect) {
      for (let opt of mSelect.options) {
        if (!opt.value) continue;
        const lat = parseFloat(opt.dataset.lat);
        const lng = parseFloat(opt.dataset.lng);
        if (!isNaN(lat) && !isNaN(lng))
          mandis.push({ id: opt.value, name: opt.text, lat, lng });
      }
    }

    // include cloned destination selects if present
    const destV = document.getElementById("destVillage");
    if (destV)
      for (let opt of destV.options) {
        if (!opt.value) continue;
        const lat = parseFloat(opt.dataset.lat);
        const lng = parseFloat(opt.dataset.lng);
        if (!isNaN(lat) && !isNaN(lng))
          villages.push({ id: `dest-${opt.value}`, name: opt.text, lat, lng });
      }
    const destM = document.getElementById("destMandi");
    if (destM)
      for (let opt of destM.options) {
        if (!opt.value) continue;
        const lat = parseFloat(opt.dataset.lat);
        const lng = parseFloat(opt.dataset.lng);
        if (!isNaN(lat) && !isNaN(lng))
          mandis.push({ id: `dest-${opt.value}`, name: opt.text, lat, lng });
      }

    return { villages, mandis };
  }

  // POI Label functions
  function createPoILabel(text, latlng) {
    // remove any existing label & timer
    removePoILabel();

    // create container
    const div = document.createElement("div");
    div.className = "poi-label";
    div.textContent = text || "";
    div.style.pointerEvents = "none";

    // attach to markerPane
    const pane = map.getPanes().markerPane || map.getPanes().overlayPane;
    pane.appendChild(div);

    activePoILabel = { el: div, latlng };

    // position now and on move/zoom
    positionPoILabel();
    map.on("move zoom", positionPoILabel);

    // auto-remove after 2 seconds
    activePoILabelTimer = setTimeout(() => {
      removePoILabel();
    }, 2000);

    // remove label if user clicks elsewhere on map
    map.once("click", () => {
      removePoILabel();
    });
  }

  function removePoILabel() {
    if (!activePoILabel) return;

    try {
      const pane = map.getPanes().markerPane || map.getPanes().overlayPane;
      if (activePoILabel.el && activePoILabel.el.parentNode) {
        activePoILabel.el.parentNode.removeChild(activePoILabel.el);
      }
    } catch (e) {
      // ignore DOM errors
    }

    // clear timer and listeners
    if (activePoILabelTimer) {
      clearTimeout(activePoILabelTimer);
      activePoILabelTimer = null;
    }
    map.off("move zoom", positionPoILabel);
    activePoILabel = null;
  }

  function positionPoILabel() {
    if (!activePoILabel) return;
    try {
      const p = map.latLngToLayerPoint(activePoILabel.latlng);
      const el = activePoILabel.el;
      el.style.position = "absolute";
      const offsetY = 20;
      el.style.left = p.x + "px";
      el.style.top = p.y + offsetY + "px";
      el.style.zIndex = 10000;
      el.style.transform = "translate(-50%, 0)";
    } catch (e) {
      // ignore positioning errors
    }
  }

  // MAIN: add village & mandi icon markers that are within radiusMeters of routeLayer
  function showVillageMandiMarkersNearRouteLayer(
    routeLayer,
    radiusMeters = 100
  ) {
    // clear old markers & label
    poiLayer.clearLayers();
    removePoILabel();

    if (!routeLayer) return;
    const coords = buildCoordsFromRouteLayer(routeLayer);
    if (!coords || coords.length < 2) return;

    const { villages, mandis } = collectPOIsFromSelects();

    function addMarker(item, isVillage) {
      const icon = isVillage ? icons.village : icons.mandi;
      const marker = L.marker([item.lat, item.lng], { icon }).addTo(poiLayer);

      marker.on("click", function (e) {
        createPoILabel(item.name || "", marker.getLatLng());

        try {
          if (typeof fetchAndShowSideDetails === "function") {
            fetchAndShowSideDetails(item, isVillage);
          }
        } catch (err) {
          console.error("fetchAndShowSideDetails error:", err);
        }
      });

      try {
        marker.unbindTooltip();
        marker.unbindPopup();
      } catch (e) {}
    }

    // check villages
    for (let v of villages) {
      let minD = Infinity;
      for (let i = 0; i < coords.length - 1; i++) {
        const A = coords[i],
          B = coords[i + 1];
        const d = pointToSegmentDistMeters(
          v.lat,
          v.lng,
          A[1],
          A[0],
          B[1],
          B[0]
        );
        if (d < minD) minD = d;
        if (minD <= radiusMeters) break;
      }
      if (minD <= radiusMeters) addMarker(v, true);
    }

    // check mandis
    for (let m of mandis) {
      let minD = Infinity;
      for (let i = 0; i < coords.length - 1; i++) {
        const A = coords[i],
          B = coords[i + 1];
        const d = pointToSegmentDistMeters(
          m.lat,
          m.lng,
          A[1],
          A[0],
          B[1],
          B[0]
        );
        if (d < minD) minD = d;
        if (minD <= radiusMeters) break;
      }
      if (minD <= radiusMeters) addMarker(m, false);
    }
  }

  // Show only village markers near route
  function showVillageMarkersNearRouteLayer(routeLayer, radiusMeters = 100) {
    poiLayer.clearLayers();
    removePoILabel();

    if (!routeLayer) return;
    const coords = buildCoordsFromRouteLayer(routeLayer);
    if (!coords || coords.length < 2) return;

    const { villages } = collectPOIsFromSelects();

    function addMarker(item) {
      const icon = icons.village;
      const marker = L.marker([item.lat, item.lng], { icon }).addTo(poiLayer);

      marker.on("click", function (e) {
        createPoILabel(item.name || "", marker.getLatLng());

        try {
          if (typeof fetchAndShowSideDetails === "function") {
            fetchAndShowSideDetails(item, true);
          }
        } catch (err) {
          console.error("fetchAndShowSideDetails error:", err);
        }
      });

      try {
        marker.unbindTooltip();
        marker.unbindPopup();
      } catch (e) {}
    }

    // check villages only
    for (let v of villages) {
      let minD = Infinity;
      for (let i = 0; i < coords.length - 1; i++) {
        const A = coords[i],
          B = coords[i + 1];
        const d = pointToSegmentDistMeters(
          v.lat,
          v.lng,
          A[1],
          A[0],
          B[1],
          B[0]
        );
        if (d < minD) minD = d;
        if (minD <= radiusMeters) break;
      }
      if (minD <= radiusMeters) addMarker(v);
    }
  }

  // Show only mandi markers near route
  function showMandiMarkersNearRouteLayer(routeLayer, radiusMeters = 100) {
    poiLayer.clearLayers();
    removePoILabel();

    if (!routeLayer) return;
    const coords = buildCoordsFromRouteLayer(routeLayer);
    if (!coords || coords.length < 2) return;

    const { mandis } = collectPOIsFromSelects();

    function addMarker(item) {
      const icon = icons.mandi;
      const marker = L.marker([item.lat, item.lng], { icon }).addTo(poiLayer);

      marker.on("click", function (e) {
        createPoILabel(item.name || "", marker.getLatLng());

        try {
          if (typeof fetchAndShowSideDetails === "function") {
            fetchAndShowSideDetails(item, false);
          }
        } catch (err) {
          console.error("fetchAndShowSideDetails error:", err);
        }
      });

      try {
        marker.unbindTooltip();
        marker.unbindPopup();
      } catch (e) {}
    }

    // check mandis only
    for (let m of mandis) {
      let minD = Infinity;
      for (let i = 0; i < coords.length - 1; i++) {
        const A = coords[i],
          B = coords[i + 1];
        const d = pointToSegmentDistMeters(
          m.lat,
          m.lng,
          A[1],
          A[0],
          B[1],
          B[0]
        );
        if (d < minD) minD = d;
        if (minD <= radiusMeters) break;
      }
      if (minD <= radiusMeters) addMarker(m);
    }
  }

  function initMap() {
    map = L.map("map").setView([30.7333, 76.7794], 7);
    let osmLayer = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors",
      }
    ).addTo(map);

    let satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    );

    L.control
      .layers({ "Street Map": osmLayer, Satellite: satelliteLayer })
      .addTo(map);

    // Initialize POI layer
    poiLayer = L.layerGroup().addTo(map);

    // Legend
    const widthLegend = L.control({ position: "topright" });
    widthLegend.onAdd = function (map) {
      const div = L.DomUtil.create("div", "info legend");
      const widths = ["<4", "4-6", "6-10", ">10", "None"];
      const colors = ["red", "orange", "blue", "black", "gray"];

      let html =
        '<h4 style="color:#7c7ca5; margin-bottom:6px;">Road Width Legend</h4>';
      for (let i = 0; i < widths.length; i++) {
        html += `
          <i style="background:${colors[i]}; width:18px; height:18px; display:inline-block; margin-right:6px;"></i>
          <span style="color:#7c7ca5;">${widths[i]} m</span><br>
        `;
      }
      div.innerHTML = html;
      div.style.backgroundColor = "white";
      div.style.padding = "8px";
      div.style.border = "1px solid #ccc";
      div.style.borderRadius = "5px";
      div.style.fontSize = "12px";
      return div;
    };
    widthLegend.addTo(map);
  }

  function addPoint(type, name, lat, lng, isVillage = false) {
    // Validation Logic
    if (selectedPoints.length < 2) {
      if (type === "destination") {
        alert(
          "First and second points must be from Village or Mandi, not Destination."
        );
        return;
      }
    } else {
      if (type !== "destination") {
        alert("Additional points can only be selected from Destination.");
        return;
      }
    }

    // Add point
    selectedPoints.push({ type, name, lat, lng, isVillage });

    const marker = L.marker([lat, lng], {
      icon: icons[type === "destination" ? "destination" : type],
    })
      .addTo(map)
      .bindPopup(`${type.charAt(0).toUpperCase() + type.slice(1)}: ${name}`)
      .openPopup();

    setTimeout(() => {
      marker.closePopup();
    }, 5000);

    updateSelectedInfo();
    fitMapToSelectedPoints();
  }

  function fitMapToSelectedPoints() {
    if (selectedPoints.length === 0) return;
    if (selectedPoints.length === 1) {
      const p = selectedPoints[0];
      map.flyTo([p.lat, p.lng], 12, { animate: true });
    } else {
      const bounds = L.latLngBounds(selectedPoints.map((p) => [p.lat, p.lng]));
      map.flyToBounds(bounds, { padding: [80, 80], maxZoom: 12 });
    }
  }

      : "None";

    html += `<br><b>Corridor Type:</b> ${corridorType}`;

  // =================== ROUTING =====================
  async function drawRoute() {
    // Determine which type to use for routing - corridor takes priority
    const routeTypeToUse = currentCorridorType || currentRouteType;

    if (selectedPoints.length < 2 || !routeTypeToUse) return;

    const spinner = document.getElementById("routeSpinner");
    if (spinner) spinner.style.display = "block";

    if (routeLayer) {
      map.removeLayer(routeLayer);
      routeLayer = null;
    }

    // Clear existing POI markers when drawing new route
    poiLayer.clearLayers();
    removePoILabel();

    let coords = selectedPoints.map((p) => [p.lat, p.lng]);
    let features = [];

    try {
      for (let i = 0; i < coords.length - 1; i++) {
        const [aLat, aLng] = coords[i];
        const [bLat, bLng] = coords[i + 1];
        const res = await fetch(
          `/route/?src_lat=${aLat}&src_lng=${aLng}&dst_lat=${bLat}&dst_lng=${bLng}&type=${routeTypeToUse}`
        );
        const data = await res.json();
        if (data.features) features = features.concat(data.features);
      }
      if (features.length > 0) {
        const routeData = { type: "FeatureCollection", features: features };

        routeLayer = L.geoJSON(routeData, {
          renderer: L.canvas(),
          style: (feature) => ({
            color:
              feature.properties?.color ||
              (routeTypeToUse === "local"
                ? "#27AE60"
                : routeTypeToUse === "highway"
                ? "#E74C3C"
                : "#2E86DE"),
            weight: 4,
            opacity: 0.8,
          }),
          onEachFeature: function (feature, layer) {
            if (feature.geometry.type === "LineString") {
              const width = feature.properties?.width || "N/A";
              const costM = feature.properties?.cost_m
                ? feature.properties.cost_m.toFixed(2)
                : "N/A";
              layer.bindTooltip(
                `<b>Width:</b> ${width} m<br><b>Cost:</b> ${costM} m`
              );
            }
          },
        }).addTo(map);

        map.fitBounds(routeLayer.getBounds());

        // Show markers based on route type
        if (currentRouteType === "direct") {
          // For direct route, don't show any nearby markers
          poiLayer.clearLayers();
        } else if (currentRouteType === "village") {
          // For intermediate village route, show only villages
          showVillageMarkersNearRouteLayer(routeLayer, 200);
        } else if (currentRouteType === "mandi") {
          // For intermediate mandi route, show only mandis
          showMandiMarkersNearRouteLayer(routeLayer, 200);
        } else {
          // For corridor types (when no specific route type selected), show both villages and mandis
          showVillageMandiMarkersNearRouteLayer(routeLayer, 200);
        }
      }
    } catch (e) {
      console.error("Route fetch failed:", e);
      alert("Failed to fetch route. Please try again.");
    } finally {
      if (spinner) spinner.style.display = "none";
      updateSelectedInfo();
    }
  }

  // =================== DOWNLOAD PDF (Map + Route + All Points) =====================
  async function downloadPDF() {
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF("p", "mm", "a4");
      const pageWidth = pdf.internal.pageSize.getWidth();

      // 1️⃣ Ensure map and routeLayer are rendered
      if (window.map && map.invalidateSize) {
        map.invalidateSize();
      }
      if (window.routeLayer && routeLayer.bringToFront) {
        routeLayer.bringToFront();
      }
      await new Promise((r) => setTimeout(r, 800)); // slight delay for rendering

      // Capture map (with route + markers)
      const mapElement = document.getElementById("map");
      const mapCanvas = await html2canvas(mapElement, {
        useCORS: true,
        logging: false,
        scale: 2,
        backgroundColor: null,
      });
      const mapImgData = mapCanvas.toDataURL("image/png");

      // Add map image to PDF
      const mapAspectRatio = mapCanvas.width / mapCanvas.height;
      const mapWidth = pageWidth - 20;
      const mapHeight = mapWidth / mapAspectRatio;
      pdf.addImage(mapImgData, "PNG", 10, 10, mapWidth, mapHeight);

      let y = 10 + mapHeight + 10;

      // 2️⃣ Selected Points Overview
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(14);
      pdf.text("Selected Points", 10, y);
      y += 6;

      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(11);
      selectedPoints.forEach((p, i) => {
        pdf.text(`• Point ${i + 1} (${p.type}): ${p.name}`, 10, y);
        y += 5;
        pdf.text(`Lat: ${p.lat}, Lng: ${p.lng}`, 14, y);
        y += 6;
      });

      // 3️⃣ Add Route Configuration Information
      y += 5;
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(13);
      pdf.text("Route Configuration", 10, y);
      y += 6;

      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(11);

      // Determine corridor type and route type
      const corridorTypes = ["local", "highway", "shortest"];
      const routeTypes = ["direct", "village", "mandi"];

      const corridorType = corridorTypes.includes(currentCorridorType)
        ? currentCorridorType.charAt(0).toUpperCase() +
          currentCorridorType.slice(1)
        : "None";

      const routeType = routeTypes.includes(currentRouteType)
        ? currentRouteType.charAt(0).toUpperCase() + currentRouteType.slice(1)
        : "None";

      pdf.text(`Corridor Type: ${corridorType}`, 10, y);
      y += 5;
      pdf.text(`Route Type: ${routeType}`, 10, y);
      y += 10;

      // 4️⃣ For each point (village, mandi, destination)
      for (const point of selectedPoints) {
        // Check if we need a new page
        if (y > 250) {
          pdf.addPage();
          y = 20;
        }

        y += 5;
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(13);
        pdf.text(
          `${point.type.charAt(0).toUpperCase() + point.type.slice(1)} Details`,
          10,
          y
        );
        y += 6;

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(11);
        pdf.text(`Name: ${point.name}`, 10, y);
        y += 5;
        pdf.text(`Coordinates: ${point.lat}, ${point.lng}`, 10, y);
        y += 5;

        // Add mandi/destination details
        if (
          point.type.toLowerCase() === "mandi" ||
          point.type.toLowerCase() === "destination"
        ) {
          pdf.text(`Type: ${point.mandi_type || "N/A"}`, 10, y);
          y += 5;
          pdf.text(`District: ${point.district || "N/A"}`, 10, y);
          y += 5;
          pdf.text(`State: ${point.state || "N/A"}`, 10, y);
          y += 5;
        }

        // Fetch and show product data for village OR destination-village
        if (
          point.type.toLowerCase() === "village" ||
          (point.type.toLowerCase() === "destination" && point.isVillage)
        ) {
          try {
            const response = await fetch(
              `/api/submitted-products/?village=${encodeURIComponent(
                point.name
              )}`
            );
            const data = await response.json();

            if (data.success && data.products?.length) {
              y += 5;
              pdf.setFont("helvetica", "bold");
              pdf.text("Submitted Products", 10, y);
              y += 4;

              const tableData = data.products.map((p) => [
                p.product_name,
                p.product_type,
                p.weight_kg,
                p.harvest_month,
                p.submission_date,
              ]);

              pdf.autoTable({
                startY: y,
                head: [
                  [
                    "Product Name",
                    "Product Type",
                    "Weight (kg)",
                    "Harvest Month",
                    "Submission Date",
                  ],
                ],
                body: tableData,
                theme: "grid",
                styles: { fontSize: 10 },
                headStyles: { fillColor: [240, 240, 240] },
                margin: { left: 10, right: 10 },
                pageBreak: "auto",
                didDrawPage: function (data) {
                  // Page header on each new page
                  pdf.setFont("helvetica", "bold");
                  pdf.setFontSize(12);
                  pdf.text(`Village: ${point.name}`, 10, 10);
                },
              });

              y = pdf.lastAutoTable.finalY + 6;
            } else {
              pdf.text(`No product data available for ${point.name}.`, 10, y);
              y += 6;
            }
          } catch (err) {
            console.error(`Failed to fetch products for ${point.name}:`, err);
            pdf.text(`Error fetching product data for ${point.name}.`, 10, y);
            y += 6;
          }
        }

        // Page break if we near bottom
        if (y > 270) {
          pdf.addPage();
          y = 20;
        }
      }

      // 5️⃣ Save file
      const pdfName = "Route_and_Points_Details.pdf";
      pdf.save(pdfName);
    } catch (error) {
      console.error("PDF generation failed:", error);
      alert("Failed to generate PDF. Please try again.");
    }
  }

  // =================== INITIALIZATION =====================
  document.addEventListener("DOMContentLoaded", function () {
    // Initialize map
    initMap();

    // Set up event listeners for panel buttons
    document
      .getElementById("villageBtn")
      .addEventListener("click", function (e) {
        e.stopPropagation();
        togglePanel("villagePanel");
      });

    document.getElementById("mandiBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      togglePanel("mandiPanel");
    });

    document
      .getElementById("destinationBtn")
      .addEventListener("click", function (e) {
        e.stopPropagation();
        togglePanel("destinationPanel");
      });

    // Set up event listeners for filter dropdowns
    document
      .getElementById("villageState")
      .addEventListener("change", filterVillageDistricts);
    document
      .getElementById("villageDistrict")
      .addEventListener("change", filterVillages);
    document
      .getElementById("mandiState")
      .addEventListener("change", filterMandiDistricts);
    document
      .getElementById("mandiDistrict")
      .addEventListener("change", filterMandis);
    document
      .getElementById("destinationType")
      .addEventListener("change", toggleDestinationType);

    // Set up event listeners for dropdown menus
    document
      .getElementById("corridorBtn")
      .addEventListener("click", toggleCorridorMenu);
    document
      .getElementById("routeTypeBtn")
      .addEventListener("click", toggleRouteTypeMenu);

    // Set up event listeners for menu items
    document.querySelectorAll("#corridorMenu button").forEach((button) => {
      button.addEventListener("click", function () {
        handleCorridor(this.getAttribute("data-type"));
      });
    });

    document.querySelectorAll("#routeTypeMenu button").forEach((button) => {
      button.addEventListener("click", function () {
        handleRouteType(this.getAttribute("data-type"));
      });
    });

    // Close menus when clicking outside
    document.addEventListener("click", function (event) {
      // Close dropdown panels
      document.querySelectorAll(".dropdown-panel").forEach((panel) => {
        if (
          !panel.contains(event.target) &&
          !event.target.closest(".panel-wrapper")
        ) {
          panel.style.display = "none";
        }
      });

      // Close dropdown menus
      const corridorMenu = document.getElementById("corridorMenu");
      const routeTypeMenu = document.getElementById("routeTypeMenu");

      if (corridorMenu && !event.target.closest(".corridor-wrapper")) {
        corridorMenu.style.display = "none";
      }

      if (routeTypeMenu && !event.target.closest(".route-type-wrapper")) {
        routeTypeMenu.style.display = "none";
      }
    });

    // Close on Escape key
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        document.querySelectorAll(".dropdown-panel").forEach((panel) => {
          panel.style.display = "none";
        });
        document.getElementById("corridorMenu").style.display = "none";
        document.getElementById("routeTypeMenu").style.display = "none";
      }
    });
  });
</script>

{% endblock %}
